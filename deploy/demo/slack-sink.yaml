apiVersion: apps/v1
kind: Deployment
metadata: { name: slack-sink }
spec:
  replicas: 1
  selector: { matchLabels: { app: slack-sink } }
  template:
    metadata: { labels: { app: slack-sink } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: sink
          image: incidentlens-backend       # reuses your image; kustomize fills the tag
          command:
            - python
            - -c
            - |
              import http.server
              class H(http.server.BaseHTTPRequestHandler):
                  def do_POST(self):
                      body = self.rfile.read(int(self.headers.get("Content-Length", 0))).decode()
                      print("SLACK MESSAGE >>>", body, flush=True)
                      self.send_response(200); self.end_headers(); self.wfile.write(b"ok")
                  def log_message(self, *a): pass
              http.server.HTTPServer(("0.0.0.0", 8080), H).serve_forever()
          ports: [{ containerPort: 8080 }]
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 64Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: slack-sink }
spec:
  selector: { app: slack-sink }
  ports: [{ port: 80, targetPort: 8080 }]