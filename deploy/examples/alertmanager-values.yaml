alertmanager:
  alertmanagerSpec:
    secrets: [incidentlens-webhook]        # mounted at /etc/alertmanager/secrets/incidentlens-webhook/
  config:
    route:
      receiver: "null"                  # default: drop everything not matched below
      routes:
        - receiver: "null"
          matchers: ['component = "incidentlens"']
        - receiver: incidentlens
          matchers: ['namespace = "at"']
          group_by: [alertname, service]
          group_wait: 10s
    receivers:
      - name: "null"
      - name: incidentlens
        webhook_configs:
          - url: http://incidentlens-api.incidentlens-dev.svc.cluster.local:8000/alerts
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/incidentlens-webhook/token