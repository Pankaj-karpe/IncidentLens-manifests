# The Celery worker: collects metrics/logs, calls the LLM, saves the result.
# Same image as the API, only the command differs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incidentlens-worker
spec:
  # DELETED the "replicas:" line. KEDA now owns the replica count. If git also says 1, Argo's
  # self-heal and KEDA would undo each other forever.
  selector:
    matchLabels: { app: incidentlens-worker }
  minReadySeconds: 10
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: incidentlens-worker }
    spec:
      terminationGracePeriodSeconds: 90   # on shutdown Celery finishes running jobs; the default 30s
                                          # is shorter than one LLM call with retries
      automountServiceAccountToken: false      # NEW
      containers:
        - name: worker
          image: incidentlens-backend
          # Linux pool (prefork) works here; "--pool=solo" was only a Windows workaround.
          # "-Q incidentlens" = the queue name set in celeryapp.py. Without it, nothing is consumed.
          # PodMonitor finds the metrics endpoint by this port NAME.
          ports:
            - name: metrics
              containerPort: 9101
          command:
            - celery
            - -A
            - app.workers.celeryapp
            - worker
            - --loglevel=info
            - -Q
            - incidentlens
            # threads, not forked processes: counters live in ONE process, so the
            # /metrics server can see them. Triage is network-bound (Prometheus, Loki,
            # LLM calls), so threads lose nothing.
            - --pool=threads
            - --concurrency=4
          envFrom:
            - configMapRef: { name: incidentlens-config }
            - secretRef: { name: incidentlens-db-creds }
            - secretRef: { name: incidentlens-worker-secrets }
          # Is the worker alive and connected to the broker? Celery can answer a "ping".
          livenessProbe:
            exec:
              command: ["sh", "-c", "celery -A app.workers.celeryapp inspect ping -d celery@$HOSTNAME"]
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 15
          # ADDED a readiness probe next to the liveness probe, so a
          # rollout waits until the new worker is really connected to Redis:
          readinessProbe:
            exec:
              command: ["sh", "-c", "celery -A app.workers.celeryapp inspect ping -d celery@$HOSTNAME"]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}