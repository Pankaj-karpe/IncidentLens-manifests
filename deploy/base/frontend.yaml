apiVersion: apps/v1
kind: Deployment
metadata:
  name: incidentlens-frontend
spec:
  replicas: 2
  selector:
    matchLabels: { app: incidentlens-frontend }
  minReadySeconds: 10          # a new pod must stay Ready 10s before it counts: catches "starts, then crashes"
  progressDeadlineSeconds: 180 # no progress for 3 min = rollout marked FAILED (Argo shows Degraded)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0        # never remove an old pod before a new one is Ready
      maxSurge: 1              # start 1 extra pod at a time
  template:
    metadata:
      labels: { app: incidentlens-frontend }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: incidentlens-frontend
          # Next.js "standalone" build listens on 3000.
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: { path: /login, port: http }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          lifecycle:
            preStop:           # runs BEFORE the shutdown signal. The ingress needs a few seconds to
              exec:            # stop sending requests to a pod that is going away: without this pause
                command: ["sleep", "5"]   # a few requests fail on every rollout
---
apiVersion: v1
kind: Service
metadata:
  name: incidentlens-frontend
spec:
  selector: { app: incidentlens-frontend }
  ports:
    - port: 80
      targetPort: http