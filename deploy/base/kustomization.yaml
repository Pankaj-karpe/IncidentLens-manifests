apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - configmap.yaml
  - postgres.yaml
  - redis.yaml
  - migrate-job.yaml
  - api.yaml
  - worker.yaml
  - frontend.yaml
  - ingress.yaml

# No images: block on purpose. Tags are set per overlay, so dev (changed by CI)
# and prod (promoted by hand) never interfere with each other.