# Non-secret settings. Anything sensitive lives in the "incidentlens-secrets" Secret instead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: incidentlens-config
data:
  # Redis is the Celery broker (cheaper than RabbitMQ for this app).
  BROKER_URL: "redis://redis:6379/0"

  # The collectors read the monitoring stack that runs in the cluster.
  # These are in-cluster DNS names, so no port-forward is needed here (unlike on your laptop).
  PROMETHEUS_URL: "http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
  LOKI_URL: "http://loki-gateway.monitoring.svc.cluster.local"
  LOKI_SERVICE_LABEL: "app"

  GITHUB_DEPLOY_REPO: "Pankaj-karpe/atomic-tickets-manifests"
  ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"
  
   # --- LLM (primary: Gemini free tier, fallback: Ollama inside the cluster) ---
  LLM_BASE_URL: "https://generativelanguage.googleapis.com/v1beta/openai"
  LLM_MODEL: "gemini-2.5-flash"
  LLM_TIMEOUT_SECONDS: "60"
  LLM_FALLBACK_BASE_URL: "http://ollama:11434/v1"
  LLM_FALLBACK_MODEL: "llama3.2:3b"
  LLM_FALLBACK_TIMEOUT_SECONDS: "300"
  EMBEDDING_BASE_URL: "https://generativelanguage.googleapis.com/v1beta/openai"
  EMBEDDING_MODEL: "gemini-embedding-001"
  EMBEDDING_DIMENSIONS: "1536"      # must match the database column
  PUBLIC_BASE_URL: "http://incidentlens.local"    # the "Open incident" link in Slack