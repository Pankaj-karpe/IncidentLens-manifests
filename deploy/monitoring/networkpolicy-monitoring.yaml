# Part 3 denies everything by default, so every new pod needs its own small openings.
# Rules ADD to each other: they never cancel earlier ones.

# 1) Prometheus may read the exporter.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-exporter-from-prometheus
spec:
  podSelector:
    matchLabels: { app: redis-exporter }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
          podSelector:
            matchLabels: { app.kubernetes.io/name: prometheus }
      ports:
        - { protocol: TCP, port: 9121 }
---
# 2) The exporter may connect OUT to Redis only (DNS is already allowed for everyone).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-exporter-egress
spec:
  podSelector:
    matchLabels: { app: redis-exporter }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app: redis } } }]
      ports: [{ protocol: TCP, port: 6379 }]
---
# 3) Redis may accept the exporter. (Part 3 only allowed the API and the worker.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-from-exporter
spec:
  podSelector:
    matchLabels: { app: redis }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: redis-exporter }
      ports:
        - { protocol: TCP, port: 6379 }