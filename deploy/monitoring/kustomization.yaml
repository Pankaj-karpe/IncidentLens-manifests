# Everything that wires IncidentLens into Prometheus and Grafana.
# Included only by overlays that run on a cluster with the Prometheus operator.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - servicemonitor-api.yaml
  - podmonitor-worker.yaml
  - redis-exporter.yaml
  - networkpolicy-monitoring.yaml
  - prometheusrule.yaml
  - dashboard.yaml