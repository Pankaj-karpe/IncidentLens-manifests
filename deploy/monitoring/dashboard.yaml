apiVersion: v1
kind: ConfigMap
metadata:
  name: incidentlens-dashboard
  labels:
    grafana_dashboard: "1"
data:
  incidentlens.json: |
    {
      "title": "IncidentLens (SRE for AI)",
      "uid": "incidentlens-ai",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        { "id": 1, "type": "stat", "title": "Alerts received (24h)",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 0 },
          "targets": [ { "refId": "A", "expr": "sum(increase(incidentlens_alerts_received_total[24h]))" } ] },
        { "id": 2, "type": "stat", "title": "Pods up (api + worker)",
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 0 },
          "targets": [ { "refId": "A", "expr": "sum(up{namespace=\"incidentlens-dev\", pod=~\"incidentlens-(api|worker)-.*\"})" } ] },
        { "id": 3, "type": "stat", "title": "LLM cost, last 24h (USD)",
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 0 },
          "targets": [ { "refId": "A", "expr": "sum(increase(incidentlens_llm_cost_usd_total[24h]))" } ] },
        { "id": 4, "type": "stat", "title": "Rejected webhook calls (1h)",
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 0 },
          "targets": [ { "refId": "A", "expr": "sum(increase(incidentlens_auth_events_total{event=\"webhook_rejected\"}[1h]))" } ] },
        { "id": 5, "type": "timeseries", "title": "Triage queue length",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 5 },
          "targets": [ { "refId": "A", "expr": "max(redis_key_size{key=\"incidentlens\"}) or vector(0)", "legendFormat": "waiting jobs" } ] },
        { "id": 6, "type": "timeseries", "title": "LLM calls per second, by outcome",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 5 },
          "targets": [ { "refId": "A", "expr": "sum by (status) (rate(incidentlens_llm_requests_total[5m]))", "legendFormat": "{{status}}" } ] },
        { "id": 7, "type": "timeseries", "title": "LLM latency p50 / p95 (seconds)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 13 },
          "targets": [
            { "refId": "A", "expr": "histogram_quantile(0.5, sum by (le) (rate(incidentlens_llm_request_duration_seconds_bucket[10m])))", "legendFormat": "p50" },
            { "refId": "B", "expr": "histogram_quantile(0.95, sum by (le) (rate(incidentlens_llm_request_duration_seconds_bucket[10m])))", "legendFormat": "p95" } ] },
        { "id": 8, "type": "timeseries", "title": "Tokens per second (in / out)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 13 },
          "targets": [ { "refId": "A", "expr": "sum by (direction) (rate(incidentlens_llm_tokens_total[5m]))", "legendFormat": "{{direction}}" } ] }
      ]
    }