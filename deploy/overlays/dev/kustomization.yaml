# Dev = the base plus small differences. Prod gets its own copy later (more replicas, other tag).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: incidentlens-dev

resources:
- namespace.yaml
- ../../base

# Dev runs lean to fit minikube's memory.
replicas:
- count: 1
  name: incidentlens-api
- count: 1
  name: incidentlens-frontend
images:
- name: incidentlens-backend
  newName: pankajkarpe1/incidentlens-backend
  newTag: 609cd4c
- name: incidentlens-frontend
  newName: pankajkarpe1/incidentlens-frontend
  newTag: 609cd4c
